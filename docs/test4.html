<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Consultant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- CONFIG (EDIT HERE) -->
<script>
const CONFIG = {
  whatsappNumber: "+919525745198",
  currentProjects: [
    { name: "Bit Dream Home - Parmanandpur - Patna", images: ["ritesh1/plot1.jpg", "ritesh1/plot2.jpg", "ritesh1/plot3.jpg", "ritesh1/plot4.jpg", "ritesh1/plot5.jpg", "ritesh1/plot6.jpg", "ritesh1/plot7.jpg", "ritesh1/plot8.jpg" ] },
  ]
};
</script>

<!-- HERO -->
<section class="bg-white py-16 text-center">
  <h1 class="text-4xl font-bold">Your Trusted Property Consultant</h1>
  <p class="mt-4 text-gray-600">Find your dream property with ease</p>
  <button onclick="scrollToEnquiry()" class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-2xl shadow">Send Enquiry</button>
</section>

<!-- CURRENT PROJECTS -->
<section class="py-12 px-6">
  <h2 class="text-2xl font-semibold mb-6">Current Projects</h2>
  <div id="currentProjects" class="grid md:grid-cols-2 gap-6"></div>
</section>

<!-- ENQUIRY -->
<section id="enquiry" class="py-12 px-6 bg-white">
  <h2 class="text-2xl font-semibold mb-6">Send Enquiry</h2>
  <form onsubmit="sendWhatsApp(event)" class="max-w-md space-y-4">
    <input id="name" type="text" placeholder="Your Name" class="w-full border p-3 rounded" required />
    <input id="phone" type="text" placeholder="Phone Number" class="w-full border p-3 rounded" required />
    <textarea id="message" placeholder="Your Message" class="w-full border p-3 rounded"></textarea>
    <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-2xl">Send on WhatsApp</button>
  </form>
</section>

<script>
function createCarousel(images, id) {
  let index = 0;

  setInterval(() => {
    index = (index + 1) % images.length;
    const img = document.getElementById(id);
    if (img) img.src = images[index];
  }, 3000);

  return `
    <div class="relative bg-black rounded-xl overflow-hidden flex items-center justify-center" style="height:300px">
      <img id="${id}" src="${images[0]}" class="max-h-full max-w-full object-contain" />
      
      <button onclick="prevSlide('${id}', ${JSON.stringify(images)})" class="absolute left-2 bg-white px-3 py-1 rounded shadow">◀</button>
      <button onclick="nextSlide('${id}', ${JSON.stringify(images)})" class="absolute right-2 bg-white px-3 py-1 rounded shadow">▶</button>
    </div>`;
}

function prevSlide(id, images) {
  const img = document.getElementById(id);
  let current = images.indexOf(img.src.split('/').pop());
  current = (current - 1 + images.length) % images.length;
  img.src = images[current];
}

function nextSlide(id, images) {
  const img = document.getElementById(id);
  let current = images.indexOf(img.src.split('/').pop());
  current = (current + 1) % images.length;
  img.src = images[current];
}

function renderProjects(containerId, projects) {
  const container = document.getElementById(containerId);
  container.innerHTML = projects.map((p, i) => `
    <div class="bg-white p-4 rounded-2xl shadow">
      <h3 class="text-lg font-bold mb-2">${p.name}</h3>
      ${createCarousel(p.images, 'carousel-' + i)}
    </div>
  `).join('');
}

function sendWhatsApp(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const message = document.getElementById('message').value;

  const text = `Name: ${name}%0APhone: ${phone}%0AMessage: ${message}`;
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${text}`, '_blank');
}

function scrollToEnquiry() {
  document.getElementById('enquiry').scrollIntoView({ behavior: 'smooth' });
}

renderProjects('currentProjects', CONFIG.currentProjects);
</script>

</body>
</html>
