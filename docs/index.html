<script>
const container = document.getElementById("content");

function section(title, content) {
  return `
    <div>
      <h2 class="text-2xl font-semibold mb-4">${title}</h2>
      ${content}
    </div>
  `;
}

// Summary
container.innerHTML += section("👤 Profile", `
  <p class="text-slate-300">${data.summary}</p>
`);

// Experience
container.innerHTML += section("💼 Experience", `
  ${data.experience.map(e => `
    <div class="p-4 bg-slate-800 rounded-xl mb-3">
      <h3 class="font-bold">${e.title} - ${e.company}</h3>
      <p class="text-sm text-slate-400">${e.duration}</p>
      <ul class="list-disc ml-5 mt-2 text-sm">
        ${e.highlights.map(h => `<li>${h}</li>`).join("")}
      </ul>
    </div>
  `).join("")}
`);

// Projects
container.innerHTML += section("🚀 Key Projects", `
  ${data.projects.map(p => `
    <div class="p-4 bg-slate-800 rounded-xl mb-3">
      <h3 class="font-bold">${p.title}</h3>
      <p class="text-sm text-slate-400">${p.description}</p>
    </div>
  `).join("")}
`);

// Certifications
container.innerHTML += section("📜 Certifications", `
  <ul class="list-disc ml-5">
    ${data.certifications.map(c => `<li>${c}</li>`).join("")}
  </ul>
`);

// Skills
container.innerHTML += section("🧠 Skills", `
  <div class="flex flex-wrap gap-2">
    ${data.skills.map(s => `
      <span class="bg-sky-500/20 px-3 py-1 rounded-full text-sm">${s}</span>
    `).join("")}
  </div>
`);

// Education
container.innerHTML += section("🎓 Education", `
  <ul class="list-disc ml-5">
    ${data.education.map(e => `<li>${e}</li>`).join("")}
  </ul>
`);
</script>
