<style>
  /* ── Google Font ── */
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap');

  /* ── CSS Reset & Variables ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:      #1a1a1a;
    --mid:      #444;
    --soft:     #666;
    --rule:     #d0d0d0;
    --accent:   #1a5276;   /* deep navy – prints well */
    --tag-bg:   #eaf2fb;
    --tag-border: #a9cce3;
    --page-max: 860px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans:  'Source Sans 3', Helvetica, Arial, sans-serif;
  }

  /* ── Page Layout ── */
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: #f4f4f4;
    padding: 32px 16px;
  }

  .page {
    max-width: var(--page-max);
    margin: 0 auto;
    background: #fff;
    padding: 48px 52px;
    border: 1px solid #ddd;
  }

  /* ── Name & Contact ── */
  .header { border-bottom: 2px solid var(--accent); padding-bottom: 14px; margin-bottom: 18px; }

  .header h1 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    margin-top: 6px;
    font-size: 13px;
    color: var(--mid);
  }
  .contact-row a { color: var(--accent); text-decoration: none; }
  .contact-row a:hover { text-decoration: underline; }

  /* ── Section ── */
  .section { margin-bottom: 20px; }

  .section-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 4px;
    margin-bottom: 10px;
  }

  /* ── Certifications / Tags ── */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 3px;
    padding: 2px 9px;
    font-size: 12px;
    color: var(--accent);
  }

  /* ── About / Objective ── */
  .prose { color: var(--mid); font-size: 13.5px; }

  /* ── Skills Grid ── */
  .skills-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    row-gap: 4px;
    font-size: 13px;
  }
  .skill-label { font-weight: 600; color: var(--ink); }
  .skill-value { color: var(--mid); }

  /* ── Experience ── */
  .job { margin-bottom: 14px; }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
  }

  .job-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
  }

  .job-company {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }

  .job-dates {
    font-size: 12px;
    color: var(--soft);
    white-space: nowrap;
  }

  .job ul {
    margin: 5px 0 0 16px;
    color: var(--mid);
    font-size: 13px;
  }
  .job ul li { margin-bottom: 2px; }

  /* ── Education ── */
  .edu-item { margin-bottom: 8px; font-size: 13px; }
  .edu-degree { font-weight: 600; color: var(--ink); }
  .edu-meta { color: var(--soft); }

  /* ── Projects ── */
  .project-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px 24px;
    font-size: 13px;
    color: var(--mid);
  }
  .project-list li { list-style: disc; margin-left: 14px; }

  /* ── Print ── */
  @media print {
    body { background: #fff; padding: 0; }
    .page { border: none; padding: 28px 36px; max-width: 100%; }
    .no-print { display: none !important; }
    a { color: var(--accent) !important; text-decoration: none !important; }
  }

  /* ── Toolbar ── */
  .toolbar {
    max-width: var(--page-max);
    margin: 0 auto 14px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 18px;
    border-radius: 4px;
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .btn:hover { background: #154360; }
</style>
</head>

//  RENDERER  –  No need to edit below here

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function section(title) {
  const s = el('div', 'section');
  s.appendChild(el('div', 'section-title', title));
  return s;
}

function render() {
  const root = document.getElementById('resume');

  // Header
  const hdr = el('div', 'header');

  const cr = el('div', 'contact-row');

      span.textContent = `${c.label} ${c.value}`;
    }
    cr.appendChild(span);
  });
  hdr.appendChild(cr);
  root.appendChild(hdr);

  // Certifications

  // Technical Skills

    left.appendChild(el('div', 'job-company', job.company));

    jh.appendChild(el('div', 'job-dates', job.dates));
    jd.appendChild(jh);
    const ul = el('ul', '');
    job.bullets.forEach(b => ul.appendChild(el('li', '', b)));
    jd.appendChild(ul);
    expSec.appendChild(jd);
  });
  root.appendChild(expSec);

  // Education

    const div = el('div', 'edu-item');
    div.appendChild(el('div', 'edu-degree', e.degree));
    div.appendChild(el('div', 'edu-meta', `${e.institution} &nbsp;|&nbsp; ${e.year}`));
    eduSec.appendChild(div);
  });
  root.appendChild(eduSec);

  projSec.appendChild(projList);

}

render();
