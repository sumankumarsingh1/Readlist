<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suman Kumar | Profile</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white">

<div class="max-w-4xl mx-auto p-6">

  <!-- Header -->
  <div class="text-center">
    <h1 class="text-4xl font-bold">Suman Kumar</h1>
    <p class="text-slate-400">Software Developer & Product Engineer</p>
  </div>

  <!-- Sections -->
  <div id="content" class="mt-10 space-y-10"></div>

</div>

<script src="data.js"></script>
<script>
  const container = document.getElementById("content");

  function createSection(title, items) {
    const section = document.createElement("div");

    section.innerHTML = `
      <h2 class="text-2xl font-semibold mb-4">${title}</h2>
      <div class="space-y-4">
        ${items.map(item => `
          <div class="p-4 bg-slate-800 rounded-xl">
            <h3 class="font-bold">${item.title}</h3>
            <p class="text-sm text-slate-400">${item.subtitle || ""}</p>
            <p class="text-sm mt-2">${item.description || ""}</p>
          </div>
        `).join("")}
      </div>
    `;

    container.appendChild(section);
  }

  // Render all sections
  createSection("💼 Work Experience", data.work);
  createSection("🎓 Education", data.education);
  createSection("📜 Certifications", data.certifications);
  createSection("🧠 Trainings", data.trainings);
  createSection("🚀 Projects", data.projects);
</script>

</body>
</html>
