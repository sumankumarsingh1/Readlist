<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Consultant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-[Poppins]">

<!-- CONFIG (EDIT HERE) -->
<script>
const CONFIG = {
  whatsappNumber: "919999999999",
  currentProjects: [
    { name: "Luxury Heights", images: ["img1.jpg", "img2.jpg", "img3.jpg"] },
    { name: "Green Valley", images: ["img4.jpg", "img5.jpg"] }
  ],
  pastProjects: [
    { name: "Sunrise Residency", images: ["img6.jpg", "img7.jpg"] }
  ],
  testimonials: [
    { name: "Rahul", text: "Great experience working with this consultant!" },
    { name: "Priya", text: "Highly professional and reliable." }
  ]
};
</script>

<!-- HERO -->
<section class="relative py-24 text-center bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900">
  <div class="absolute inset-0 bg-black/40"></div>
  <div class="relative z-10">
    <h1 class="text-5xl font-bold tracking-tight">Premium Property Consulting</h1>
    <p class="mt-4 text-gray-300 text-lg">Helping you invest in the right future</p>
    <button onclick="scrollToEnquiry()" class="mt-8 bg-amber-500 hover:bg-amber-600 text-black px-8 py-3 rounded-full shadow-lg transition">Send Enquiry</button>
  </div>
</section>

<!-- CURRENT PROJECTS -->
<section class="py-16 px-6 max-w-6xl mx-auto">
  <h2 class="text-3xl font-semibold mb-10 text-amber-400">Current Projects</h2>
  <div id="currentProjects" class="grid md:grid-cols-2 gap-8"></div>
</section>

<!-- PAST PROJECTS -->
<section class="py-16 px-6 bg-slate-800">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-3xl font-semibold mb-10 text-amber-400">Past Projects</h2>
    <div id="pastProjects" class="grid md:grid-cols-2 gap-8"></div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section class="py-16 px-6 max-w-6xl mx-auto">
  <h2 class="text-3xl font-semibold mb-10 text-amber-400">Client Testimonials</h2>
  <div id="testimonials" class="grid md:grid-cols-2 gap-8"></div>
</section>

<!-- ENQUIRY -->
<section id="enquiry" class="py-16 px-6 bg-slate-800">
  <div class="max-w-xl mx-auto">
    <h2 class="text-3xl font-semibold mb-8 text-amber-400">Send Enquiry</h2>
    <form onsubmit="sendWhatsApp(event)" class="space-y-4">
      <input id="name" type="text" placeholder="Your Name" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-amber-400" required />
      <input id="phone" type="tel" placeholder="Phone Number (with country code)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-amber-400" required />
      <select id="project" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-amber-400">
        <option value="">Select Project (optional)</option>
        ${[...CONFIG.currentProjects, ...CONFIG.pastProjects].map(p => `<option value="${p.name}">${p.name}</option>`).join('')}
      </select>
      <textarea id="message" placeholder="Your Message" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-amber-400"></textarea>
      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-full shadow transition">Send on WhatsApp</button>
    </form>
  </div>
</section>

<script>
function createCarousel(images) {
  return `
    <div class="relative">
      <img src="${images[0]}" class="w-full h-56 object-cover rounded-xl shadow-lg" />
      <div class="flex gap-2 mt-3 justify-center">
        ${images.map((img, i) => `<button class=\"w-3 h-3 rounded-full bg-gray-400 hover:bg-amber-400\" onclick=\"this.parentElement.parentElement.querySelector('img').src='${img}'\"></button>`).join('')}
      </div>
    </div>`;
}

function renderProjects(containerId, projects) {
  const container = document.getElementById(containerId);
  container.innerHTML = projects.map(p => `
    <div class="bg-slate-800 p-5 rounded-2xl shadow-xl hover:scale-[1.02] transition">
      <h3 class="text-xl font-semibold mb-3 text-white">${p.name}</h3>
      ${createCarousel(p.images)}
    </div>
  `).join('');
}

function renderTestimonials() {
  const container = document.getElementById('testimonials');
  container.innerHTML = CONFIG.testimonials.map(t => `
    <div class="bg-slate-800 p-6 rounded-2xl shadow-lg">
      <p class="text-gray-300 italic">"${t.text}"</p>
      <p class="mt-4 font-semibold text-amber-400">- ${t.name}</p>
    </div>
  `).join('');
}

function sendWhatsApp(e) {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const project = document.getElementById('project').value;
  const message = document.getElementById('message').value.trim();

  if (!name || !phone) {
    alert('Please fill Name and Phone');
    return;
  }

  const formattedMessage = `📩 *New Property Enquiry*
    👤 Name: ${name}
    📞 Phone: ${phone}
    🏢 Project: ${project || 'Not specified'}
    💬 Message: ${message || 'N/A'}`;

  const encodedText = encodeURIComponent(formattedMessage);

  // Better compatibility URL
  const whatsappURL = `https://api.whatsapp.com/send?phone=${CONFIG.whatsappNumber}&text=${encodedText}`;

  window.open(whatsappURL, '_blank');}%0APhone: ${phone}%0AMessage: ${message}`;
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${text}`, '_blank');


function scrollToEnquiry() {
  document.getElementById('enquiry').scrollIntoView({ behavior: 'smooth' });
}

renderProjects('currentProjects', CONFIG.currentProjects);
renderProjects('pastProjects', CONFIG.pastProjects);
renderTestimonials();
</script>

</body>
</html>
