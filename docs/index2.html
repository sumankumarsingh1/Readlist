      company: "Bright Computer Center", client: "Shahada Soot Girni",
      from: "1994", to: "1995",
      details: "Built an integrated enterprise system covering billing, payroll, inventory, and accounting with hardware integration via IO port for weighing scale machines. Deployed on Novell LAN.",
      roles: ["Developer", "Integration Engineer"],
      requirement: "Integrate weighing machine data and automate enterprise operations",
      solution: "Built data capture mechanism and integrated with FoxPro-based systems",
      technologies: ["FoxPro", "IO Port Integration", "Novell NetWare LAN"],
      teamSize: "3-5"
    },
    {
      title: "Billing & Invoicing System",
      company: "Bright Computer Center", client: "Chajjed Industries",
      from: "Feb 1992", to: "Jun 1995",
      details: "Developed a billing and invoicing system automating invoice generation, record management, and basic reporting for small-scale industry operations.",
      roles: ["Developer"],
      requirement: "Automate billing and record-keeping processes",
      solution: "Designed and developed database-driven billing application",
      technologies: ["dBase III Plus", "FoxBase"],
      teamSize: "1"
    }
  ]
};

// ─────────────────────────────────────────────────────────────────
//  RENDER FUNCTIONS
// ─────────────────────────────────────────────────────────────────
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  return e;
}

function pills(arr) {
  return arr.map(function(t) { return '<span class="tech-pill">' + t + '</span>'; }).join('');
}

function render(d) {
  var p = d.personal;

  // Sidebar
  document.getElementById('avatar').textContent = p.name.charAt(0);
  document.getElementById('sidebar-name').textContent = p.name;
  document.getElementById('sidebar-role').textContent = p.subtitle;
  document.getElementById('sidebar-links').innerHTML =
    '<a href="' + p.linkedin + '" target="_blank" rel="noopener">' +
    '<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>' +
    ' LinkedIn</a>' +
    '<a href="' + p.credly + '" target="_blank" rel="noopener">' +
    '<svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>' +
    ' Credly Badges</a>';

  // Hero
  var parts = p.name.split(' ');
  var last = parts.pop();
  document.getElementById('hero-name').innerHTML = parts.join(' ') + ' <span>' + last + '</span>';
  document.getElementById('hero-title').textContent = p.title + '  ·  ' + p.subtitle;
  document.getElementById('hero-summary').textContent = d.summary;

  // Core Skills
  var sg = document.getElementById('skills-grid');
  d.coreSkills.forEach(function(s) {
    sg.appendChild(el('span', 'skill-tag', s));
  });

  // Experience
  var expWrap = document.getElementById('exp-list');
  d.experience.forEach(function(exp) {
    var div = el('div', 'exp-item');
    div.innerHTML =
      '<div>' +
        '<div class="exp-period">' + exp.from + '<br>&#8594; ' + exp.to + '</div>' +
        '<div class="exp-company">' + exp.company + '</div>' +
      '</div>' +
      '<div>' +
        '<div class="exp-title">' + exp.title + '</div>' +
        '<ul class="resp-list">' +
          exp.responsibilities.map(function(r) { return '<li>' + r + '</li>'; }).join('') +
        '</ul>' +
        '<div class="tech-pills">' + pills(exp.technologies) + '</div>' +
      '</div>';
    expWrap.appendChild(div);
  });

  // Projects
  var pg = document.getElementById('project-grid');
  d.projects.forEach(function(proj) {
    var shown = proj.technologies.slice(0, 4);
    var extra = proj.technologies.length > 4 ? proj.technologies.length - 4 : 0;
    var card = el('div', 'project-card');
    card.innerHTML =
      '<div class="project-period">' + proj.from + ' &#8594; ' + proj.to + '</div>' +
      '<div class="project-title">' + proj.title + '</div>' +
      '<div class="project-company">' + proj.company + '</div>' +
      '<div class="project-desc">' + proj.details + '</div>' +
      '<div class="tech-pills">' + pills(shown) + (extra ? '<span class="tech-pill">+' + extra + '</span>' : '') + '</div>';
    card.onclick = function() { openModal(proj); };
    pg.appendChild(card);
  });

  // Certifications
  document.getElementById('cert-grid').innerHTML =
    '<div class="cert-group"><h3>Professional</h3><ul class="cert-list">' +
      d.certifications.professional.map(function(c) { return '<li>' + c + '</li>'; }).join('') +
    '</ul></div>' +
    '<div class="cert-group"><h3>Cloud & AI</h3><ul class="cert-list">' +
      d.certifications.cloudAndAI.map(function(c) { return '<li>' + c + '</li>'; }).join('') +
    '</ul></div>';

  // Tech Stack
  var ts = document.getElementById('tech-stack');
  Object.keys(d.technicalSkills).forEach(function(label) {
    var sec = el('div', 'tech-section');
    sec.innerHTML = '<h3>' + label + '</h3><div class="skills-grid">' +
      d.technicalSkills[label].map(function(i) { return '<span class="skill-tag">' + i + '</span>'; }).join('') +
      '</div>';
    ts.appendChild(sec);
  });

  // Education
  var eduWrap = document.getElementById('edu-list');
  d.education.forEach(function(e) {
    eduWrap.appendChild(el('div', 'edu-item',
      '<div class="edu-degree">' + e.degree + '</div>' +
      (e.institution ? '<div class="edu-inst">' + e.institution + '</div>' : '')
    ));
  });

  setupScrollSpy();
}

function openModal(proj) {
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-period">' + proj.from + ' &#8594; ' + proj.to + '</div>' +
    '<div class="modal-title">' + proj.title + '</div>' +
    '<div class="modal-client">' + proj.company + ' &middot; ' + proj.client + '</div>' +
    '<div class="modal-section"><h4>Overview</h4><p>' + proj.details + '</p></div>' +
    '<div class="modal-section"><h4>Requirement</h4><p>' + proj.requirement + '</p></div>' +
    '<div class="modal-section"><h4>Solution</h4><p>' + proj.solution + '</p></div>' +
    '<div class="modal-section"><h4>Roles</h4><div class="modal-roles">' +
      proj.roles.map(function(r) { return '<span class="modal-role">' + r + '</span>'; }).join('') +
    '</div></div>' +
    '<div class="modal-section"><h4>Technologies</h4><div class="tech-pills">' + pills(proj.technologies) + '</div></div>' +
    '<div class="modal-section"><h4>Team Size</h4><p>' + proj.teamSize + '</p></div>';
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').onclick = function() {
  document.getElementById('modal-overlay').classList.remove('open');
};
document.getElementById('modal-overlay').onclick = function(e) {
  if (e.target === this) this.classList.remove('open');
};

function setupScrollSpy() {
  var sections = document.querySelectorAll('section[id], div.hero[id]');
  var links = document.querySelectorAll('nav a');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        links.forEach(function(a) { a.classList.remove('active'); });
        var active = document.querySelector('nav a[href="#' + entry.target.id + '"]');
        if (active) active.classList.add('active');
      }
    });
  }, { threshold: 0.25 });
  sections.forEach(function(s) { observer.observe(s); });
}

render(DATA);
</script>
</body>
</html>
